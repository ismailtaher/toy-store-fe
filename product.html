<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Toy Store</title>
    <meta name="description" content="Premium educational toy from Toy Store">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="">

    <!-- Header -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Toy<span>Store</span></a>
            
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="cart.html" class="cart-icon-container">
                    <i class="ri-shopping-cart-2-line"></i>
                    <span class="cart-count" id="navCartCount">0</span>
                </a>
                <div class="mobile-menu-btn" id="menuBtn">
                    <i class="ri-menu-line"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Product Details Section -->
    <main class="container product-detail-container" id="productContainer">
        <!-- Content injected by JS -->
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div>
                <a href="index.html" class="logo footer-logo">Toy<span>Store</span></a>
                <p class="footer-p">Premium educational toys for the bright minds of tomorrow. Cash on delivery across Pakistan.</p>
            </div>
            <div>
                <h3>Quick Links</h3>
                <ul class="footer-p" style="line-height: 2;">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </div>
            <div>
                <h3>Contact Us</h3>
                <p class="footer-p"><i class="ri-map-pin-line"></i> Lahore, Pakistan</p>
                <p class="footer-p"><i class="ri-phone-line"></i> +92 300 0000000</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Toy Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/923000000000" target="_blank" class="whatsapp-float">
        <i class="ri-whatsapp-line"></i>
    </a>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const product = getProductBySlug(slug);

            if (!product) {
                document.getElementById('productContainer').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 5rem 0;">
                        <h2>Product Not Found</h2>
                        <p>Sorry, the product you are looking for does not exist.</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Home</a>
                    </div>
                `;
                return;
            }

            // Update SEO Metadata dynamically (Googlebot executes JS)
            document.title = `${product.name} - Toy Store`;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.setAttribute('content', product.short_desc || product.description);
            }

            // Render Product UI
            let thumbnailsHTML = '';
            product.images.forEach((img, idx) => {
                thumbnailsHTML += `
                    <div class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeMainImage(this, '${img}')">
                        <img src="${img}" alt="${product.name} thumbnail ${idx+1}">
                    </div>
                `;
            });

            let detailsListHTML = '';
            if (product.details) {
                product.details.forEach(det => {
                    detailsListHTML += `<li>${det}</li>`;
                });
            }

            const html = `
                <div class="product-gallery">
                    <div class="main-image">
                        <img id="mainProductImg" src="${product.images[0]}" alt="${product.name}">
                    </div>
                    <div class="thumbnail-row">
                        ${thumbnailsHTML}
                    </div>
                </div>
                <div class="product-full-info">
                    <span class="product-category" style="position: static; display: inline-block; margin-bottom: 1rem; border: 1px solid var(--secondary-color);">${product.category}</span>
                    <h1>${product.name}</h1>
                    <div class="product-full-price">${formatPrice(product.price)}</div>
                    
                    <div class="quantity-selector">
                        <span style="font-weight: 500;">Quantity:</span>
                        <button class="quantity-btn" onclick="updateQty(-1)">-</button>
                        <input type="text" id="qtyInput" class="quantity-input" value="1" readonly>
                        <button class="quantity-btn" onclick="updateQty(1)">+</button>
                    </div>

                    <button class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.1rem; box-shadow: var(--shadow-md); margin-bottom: 2rem;" onclick="addCurrentToCart()">Add to Cart <i class="ri-shopping-cart-2-line"></i></button>

                    <p class="product-desc">${product.description}</p>
                    
                    <ul class="product-details-list">
                        ${detailsListHTML}
                    </ul>
                </div>
            `;

            document.getElementById('productContainer').innerHTML = html;

            window.addCurrentToCart = function() {
                const qty = parseInt(document.getElementById('qtyInput').value);
                addToCart(product.slug, qty);
            };
        });

        // Global functions for inline handlers
        function changeMainImage(el, src) {
            document.getElementById('mainProductImg').src = src;
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function updateQty(change) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + change;
            if (val < 1) val = 1;
            if (val > 10) val = 10;
            input.value = val;
        }
    </script>
</body>
</html>
